name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Pyright
        run: pyright
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Tests (includes real hdiutil images in a temp folder)
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
      - name: Install script smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          scripts/install.sh "$RUNNER_TEMP/bin/finvault" python
          "$RUNNER_TEMP/bin/finvault" --version
